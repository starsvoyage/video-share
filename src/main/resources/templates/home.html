<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('VideoShare', ~{::content}, true, true)}">

<th:block th:fragment="content">
    <div class="container py-5">
        <section>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 mb-0">Recent Videos</h2>
            </div>

            <!-- Loading -->
            <div id="videosLoading" class="text-center py-5">
                <div class="spinner-border text-dark"></div>
                <div class="mt-3 text-muted">Loading videos...</div>
            </div>

            <!-- Error -->
            <div id="videosError" class="text-danger d-none">
                Could not load videos.
            </div>

            <!-- Empty -->
            <div id="videosEmpty" class="text-muted d-none">
                No videos available yet.
            </div>

            <!-- Grid -->
            <div id="videosGrid" class="vs-video-grid d-none"></div>
        </section>
    </div>

    <script th:inline="javascript">
        const showAds = [[${showAds}]];

        document.addEventListener("DOMContentLoaded", async function () {

            const videosLoading = document.getElementById("videosLoading");
            const videosError = document.getElementById("videosError");
            const videosEmpty = document.getElementById("videosEmpty");
            const videosGrid = document.getElementById("videosGrid");

            try {
                const res = await fetch("/api/videos");
                if (!res.ok) throw new Error();

                const videos = await res.json();

                videosLoading.classList.add("d-none");

                if (!videos || videos.length === 0) {
                    videosEmpty.classList.remove("d-none");
                    return;
                }

                // Render videos
                videosGrid.innerHTML = videos.map(video => `
                    <a href="/videos/${video.id}" class="text-decoration-none text-dark">
                        <div class="card h-100 border-0 shadow-sm rounded-4">
                            <div class="vs-video-thumb rounded-top-4 bg-dark text-white d-flex align-items-center justify-content-center">
                                <i class="bi bi-play-btn fs-1"></i>
                            </div>

                            <div class="card-body">
                                <h5 class="card-title mb-2">
                                    ${escapeHtml(video.title || "Untitled Video")}
                                </h5>

                                <div class="text-muted small mb-1">
                                    ${escapeHtml(video.channel?.name || "Unknown Channel")}
                                </div>

                                <div class="text-muted small">
                                    ${formatUploadedDate(video.createdAt)}
                                </div>
                            </div>
                        </div>
                    </a>
                `).join("");

                // Ads (every 8 videos)
                if (showAds) {
                    const videoCards = videosGrid.querySelectorAll(':scope > a');

                    for (let i = 0; i < videoCards.length; i++) {
                        if ((i + 1) % 8 === 0 && i + 1 < videoCards.length) {
                            const adDiv = document.createElement('div');
                            adDiv.style.gridColumn = '1 / -1';

                            adDiv.innerHTML = `
                                <div class="text-center my-4">
                                    <div class="text-muted small mb-2">Advertisement</div>
                                    <img src="https://picsum.photos/728/90"
                                         class="img-fluid rounded">
                                </div>
                            `;

                            videoCards[i].parentNode.insertBefore(
                                adDiv,
                                videoCards[i].nextSibling
                            );
                        }
                    }
                }

                // SHOW GRID
                videosGrid.classList.remove("d-none");

            } catch (e) {
                videosLoading.classList.add("d-none");
                videosError.classList.remove("d-none");
            }

            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str || "";
                return div.innerHTML;
            }

            function formatUploadedDate(iso) {
                if (!iso) return "";
                const d = new Date(iso);
                return `Uploaded ${d.toLocaleDateString("en-US", {
                    month: "short",
                    day: "numeric",
                    year: "numeric"
                })}`;
            }
        });
    </script>

    <!-- Bottom Ad -->
    <div th:if="${showAds}" id="fixedBottomAd" class="vs-fixed-bottom-ad">
        <div class="vs-fixed-bottom-ad-inner">
            <div class="vs-fixed-bottom-ad-label">Advertisement</div>

            <img src="https://picsum.photos/728/90"
                 class="vs-fixed-bottom-ad-img">

            <button type="button"
                    class="vs-fixed-bottom-ad-close"
                    onclick="document.getElementById('fixedBottomAd').style.display='none'">
                ×
            </button>
        </div>
    </div>

</th:block>
</html>
