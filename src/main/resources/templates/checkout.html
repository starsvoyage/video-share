<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('VideoShare | Checkout', ~{::content}, false, false)}">

<th:block th:fragment="content">

    <div class="login-page d-flex align-items-start justify-content-center">
        <div class="container py-5">

            <!-- Header -->
            <div class="text-center mb-5">
                <img th:src="@{/images/vs-logo.svg}"
                     alt="VideoShare"
                     height="64"
                     style="margin-bottom:16px;">

                <h1 class="fw-bold text-white display-5 mb-2">Complete Your Membership</h1>
                <p class="text-white-50 fs-5 mb-0">
                    Enter your payment details to start your subscription.
                </p>
            </div>

            <div class="row g-4 justify-content-center">

                <!-- PLAN SUMMARY -->
                <div class="col-12 col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 bg-dark text-white h-100">
                        <div class="card-body p-4">

                            <h4 class="fw-bold mb-3" th:text="${plan.name}">Premium</h4>

                            <div class="mb-3 text-white-50">
                                <span th:text="${plan.code}">PREMIUM</span>
                            </div>

                            <div class="fw-bold display-6 mb-2">
                                <span th:text="${'$' + #numbers.formatDecimal(plan.cost / 100.0, 1, 2)}">
                                    $9.99
                                </span>
                            </div>

                            <div class="text-white-50 mb-4">/ month</div>

                            <ul class="mb-0">
                                <li class="mb-2"
                                    th:text="${plan.adFree ? 'Ad-free playback' : 'Ads included'}">
                                    Ad-free playback
                                </li>
                                <li class="mb-2"
                                    th:text="${plan.hd4KPlayback ? 'HD / 4K playback included' : 'Standard playback only'}">
                                    HD / 4K playback included
                                </li>
                            </ul>

                        </div>
                    </div>
                </div>

                <!-- PAYMENT FORM -->
                <div class="col-12 col-lg-6">
                    <div class="checkout-form text-white">

                        <h5 class="fw-semibold mb-4">Payment Information</h5>

                        <form th:action="@{/checkout}" method="post">

                            <!-- PLAN ID -->
                            <input type="hidden"
                                   name="membershipPlanId"
                                   th:value="${plan.id}">

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Cardholder Name</label>
                                    <input type="text"
                                           name="cardholderName"
                                           class="form-control form-control-lg login-input"
                                           placeholder="Full Name"
                                           required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Payment Type</label>
                                    <select name="paymentType"
                                            class="form-select form-select-lg login-input"
                                            required>
                                        <option value="CREDIT_CARD">Credit Card</option>
                                        <option value="DEBIT_CARD">Debit Card</option>
                                    </select>
                                </div>

                                <div class="col-md-8">
                                    <label class="form-label fw-semibold">Card Number</label>
                                    <input type="text"
                                           name="cardNumber"
                                           class="form-control form-control-lg login-input"
                                           placeholder="1234 5678 1234 5678"
                                           required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Expiration Date</label>
                                    <input type="text"
                                           name="expirationDate"
                                           class="form-control form-control-lg login-input"
                                           placeholder="MM/YY"
                                           required>
                                </div>

                            </div>

                            <div class="mt-4 d-flex gap-2">

                                <button type="submit"
                                        class="btn btn-success btn-lg rounded-pill px-4">
                                    Start Membership
                                </button>

                                <a th:href="@{/choose-plan}"
                                   class="btn btn-outline-light btn-lg rounded-pill px-4">
                                    Back
                                </a>

                            </div>

                        </form>
                    </div>
                </div>

            </div>

        </div>
    </div>
</th:block>
</html>
